[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sci-data-tool"
version = "0.1.0"
description = "Small tool for analysis and visualization of experimental data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[tool.setuptools]
packages = ["sci_tool"]